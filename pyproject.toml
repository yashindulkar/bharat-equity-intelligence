[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bharat-equity-intelligence"
version = "0.1.0"
description = "Synthetic-only point-in-time domain foundation for private equity research"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "mypy==1.15.0",
    "pytest==8.3.5",
    "ruff==0.11.0",
]

[project.scripts]
bharat-equity-synthetic = "bharat_equity.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: isolated domain tests",
    "property: invariant tests",
    "leakage: point-in-time adversarial tests",
    "integration: offline boundary tests",
    "security: offline and fixture safety tests",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
